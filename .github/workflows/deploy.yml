name: Deploy personal site

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-personal-site
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build and deploy
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install markdown PyYAML pygments

      - name: Build site
        run: python3 scripts/build_site.py

      - name: Install deployment tools
        run: sudo apt-get update && sudo apt-get install -y rsync openssh-client

      - name: Prepare deployment bundle
        run: |
          set -euo pipefail
          rm -rf .deploy
          mkdir -p .deploy
          cp -a index.html public static js .deploy/
          for optional_path in img assets favicon.ico robots.txt sitemap.xml 404.html; do
            if [ -e "$optional_path" ]; then
              cp -a "$optional_path" .deploy/
            fi
          done

      - name: Configure SSH
        env:
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT || '22' }}
        run: |
          set -euo pipefail
          if [ -z "${SERVER_SSH_KEY:-}" ] || [ -z "${SERVER_HOST:-}" ]; then
            echo "SERVER_SSH_KEY and SERVER_HOST secrets are required." >&2
            exit 1
          fi
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$SERVER_PORT" -H "$SERVER_HOST" >> ~/.ssh/known_hosts

      - name: Deploy static files
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT || '22' }}
          SERVER_PATH: ${{ secrets.SERVER_PATH }}
        run: |
          set -euo pipefail

          if [ -z "${SERVER_HOST:-}" ] || [ -z "${SERVER_USER:-}" ] || [ -z "${SERVER_PATH:-}" ]; then
            echo "SERVER_HOST, SERVER_USER, and SERVER_PATH secrets are required." >&2
            exit 1
          fi

          case "$SERVER_PATH" in
            "/"|"/root"|"/home"|"/var"|"/var/www"|"/usr"|"/etc")
              echo "Refusing to deploy to unsafe SERVER_PATH: $SERVER_PATH" >&2
              exit 1
              ;;
          esac

          ssh -i ~/.ssh/deploy_key -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST" "mkdir -p '$SERVER_PATH'"

          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key -p $SERVER_PORT" \
            .deploy/ \
            "$SERVER_USER@$SERVER_HOST:$SERVER_PATH/"

  <circle cx="72" cy="40" r="5" stroke="currentColor" stroke-width="1.5"/>
  <!-- Shutter button -->
  <rect x="135" y="24" width="14" height="6" rx="3" stroke="currentColor" stroke-width="1.5"/>

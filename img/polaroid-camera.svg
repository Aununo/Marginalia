  <!-- Lens -->
  <circle cx="100" cy="100" r="28" stroke="currentColor" stroke-width="2"/>
  <circle cx="100" cy="100" r="18" stroke="currentColor" stroke-width="1.5"/>
  <circle cx="100" cy="100" r="8" stroke="currentColor" stroke-width="1"/>
  <!-- Viewfinder -->
